# PR 檢查：合併到 main 之前先確認內容檢查、建置和 CV 都沒問題（不部署）。
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - name: Install Chromium for the CV PDF
        run: npx playwright install --with-deps chromium
      - name: Build site and one-page CV PDFs
        run: npm run cv
      - name: Upload CV PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: public/cv/*.pdf
          retention-days: 14
